<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Raseed">
  <title>Raseed mark (compact)</title>
  <!-- Compact mark — beam and two trays only. This is the app-tile and favicon
       glyph, for anything under 28px where the post and base would turn to mush. -->
